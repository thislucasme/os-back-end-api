services:
  mysql:
    image: mysql:8.0
    container_name: auth_mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: os
      MYSQL_USER: os_user
      MYSQL_PASSWORD: ospass

    ports:
      - "127.0.0.1:3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:

